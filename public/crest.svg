<svg xmlns="http://www.w3.org/2000/svg" viewBox="256 -100 408 566" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- Forma del escudo (borde interior del aro blanco), medida sobre el escudo de referencia -->
    <path id="shield" d="M350 3 Q460 69 570 3 L641 72 C616 120 616 180 643 280 C643 360 580 415 460 446 C340 415 277 360 277 280 C304 180 304 120 279 72 Z"/>
    <clipPath id="inside"><use href="#shield"/></clipPath>
  </defs>

  <!-- Estrella -->
  <path fill="#d9a43a" d="M460 -92 L471.8 -63.3 L502.8 -61 L479 -41 L486.5 -10.9 L460 -27.3 L433.5 -10.9 L441 -41 L417.2 -61 L448.2 -63.3 Z"/>

  <!-- Aro: linea negra exterior + aro blanco -->
  <use href="#shield" fill="none" stroke="#0e1210" stroke-width="30" stroke-linejoin="round"/>
  <use href="#shield" fill="none" stroke="#ffffff" stroke-width="23" stroke-linejoin="round"/>

  <!-- Interior: banda blanca + cuerpo negro con dos franjas verdes -->
  <g clip-path="url(#inside)">
    <rect x="250" y="-20" width="420" height="168" fill="#ffffff"/>
    <rect x="250" y="148" width="420" height="320" fill="#0e1210"/>
    <rect x="370" y="162" width="60" height="300" fill="#1fa05a"/>
    <rect x="490" y="162" width="60" height="300" fill="#1fa05a"/>
  </g>

  <!-- Linea negra interior -->
  <use href="#shield" fill="none" stroke="#0e1210" stroke-width="6" stroke-linejoin="round"/>

  <!-- Nombre -->
  <text x="460" y="124" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="50" fill="#0e1210" textLength="268" lengthAdjust="spacingAndGlyphs">LA MANSION</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
